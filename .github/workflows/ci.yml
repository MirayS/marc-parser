name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        experimental: [false]
        include:
          # 8.6 is still in beta; keep it visible but non-blocking.
          - php: '8.6'
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, xmlreader, mbstring, intl, zip, zlib
          coverage: none
      - run: composer install --no-interaction --prefer-dist ${{ matrix.experimental && '--ignore-platform-req=php+' || '' }}
      - run: composer test
      - run: composer analyse
